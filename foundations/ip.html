        <p class="docs-lede">拼图单元是协作智能体的视觉核心。下面两套方案只作为形象参考，还没有收进组件库。</p>
        <p class="docs-ip-status">施工中</p>

        <section class="docs-section">
          <h2 class="docs-h2">方案 1</h2>
          <p class="docs-prose">协作智能体 IP 形象方案。以拼图单元连接节点、神经网络、文件夹、协作邀请、开发协作和矩阵。</p>
          <div class="docs-ip-stack">
            <figure class="docs-ip-figure">
              <img src="../assets/ip/scheme-1-board-a.png" alt="方案1：协作智能体 IP 形象总览，包含节点、神经网络、文件夹、协作邀请、开发协作和矩阵">
              <figcaption>总览板。节点、神经网络、文件夹、协作邀请、开发协作、矩阵，以及输出 / 输入的基础组合。</figcaption>
            </figure>
            <figure class="docs-ip-figure">
              <img src="../assets/ip/scheme-1-board-b.png" alt="方案1的另一版编排，左侧是大型拼图形象，右侧是六个场景卡片">
              <figcaption>同一方案的另一版编排。左侧是大型拼图形象，右侧按场景拆开说明。</figcaption>
            </figure>
          </div>
        </section>

        <section class="docs-section">

          <div class="docs-ip-stack">
            <figure class="docs-ip-figure">
