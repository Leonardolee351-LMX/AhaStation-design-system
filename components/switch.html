<!DOCTYPE html>
<html lang="zh-CN" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开关：AhaStation 设计系统</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body>
  <a class="aha-skip" href="#content">跳到正文</a>
  <div class="docs-shell">
    <aside class="docs-sidebar" id="docs-sidebar"></aside>
    <div class="docs-main-wrap">
      <header class="docs-topbar">
        <button type="button" class="docs-menu" aria-controls="docs-sidebar" aria-expanded="false" aria-label="打开导航"><span data-icon="menu"></span></button>
        <p class="docs-crumb">原子组件 / 开关</p>
      </header>
      <main id="content" class="docs-main docs-main--wide">
        <h1 class="docs-h1">开关 <span class="docs-en">Switch</span></h1>
        <p class="docs-lede">立刻打开或关闭一项设置，例如是否在项目室显示会议提醒。不要把开关当成提交表单的步骤。</p>

        <section class="docs-section">
          <h2 class="docs-h2">现场示例</h2>
          <div class="docs-stage docs-stack">
            <label class="aha-switch"><input type="checkbox" checked><span class="aha-switch-ui"></span>会议提醒</label>
            <label class="aha-switch"><input type="checkbox"><span class="aha-switch-ui"></span>自动同步看板</label>
          </div>
          <div class="docs-annote"><code class="docs-token" data-copy="--aha-color-primary" title="点击复制">--aha-color-primary</code><code class="docs-token" data-copy="--aha-duration-mid" title="点击复制">--aha-duration-mid</code></div>
        </section>
        <section class="docs-section">
          <h2 class="docs-h2">状态矩阵</h2>
          <table class="docs-matrix">
            <thead><tr><th></th><th>关闭</th><th>打开</th><th>禁用关闭</th><th>禁用打开</th></tr></thead>
            <tbody>
              <tr>
                <td class="docs-rowhead">开关</td>
                <td><label class="aha-switch"><input type="checkbox"><span class="aha-switch-ui"></span>提醒</label></td>
                <td><label class="aha-switch"><input type="checkbox" checked><span class="aha-switch-ui"></span>提醒</label></td>
                <td><label class="aha-switch"><input type="checkbox" disabled><span class="aha-switch-ui"></span>提醒</label></td>
                <td><label class="aha-switch"><input type="checkbox" checked disabled><span class="aha-switch-ui"></span>提醒</label></td>
              </tr>
            </tbody>
          </table>
        </section>

      </main>
    </div>
  </div>
  <div class="docs-backdrop" id="docs-backdrop"></div>
  <script src="../js/nav.js"></script>
  <script src="../js/docs.js"></script>
</body>
</html>
