<!DOCTYPE html>
<html lang="zh-CN" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单选：AhaStation 设计系统</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body>
  <a class="aha-skip" href="#content">跳到正文</a>
  <div class="docs-shell">
    <aside class="docs-sidebar" id="docs-sidebar"></aside>
    <div class="docs-main-wrap">
      <header class="docs-topbar">
        <button type="button" class="docs-menu" aria-controls="docs-sidebar" aria-expanded="false" aria-label="打开导航"><span data-icon="menu"></span></button>
        <p class="docs-crumb">原子组件 / 单选</p>
      </header>
      <main id="content" class="docs-main docs-main--wide">
        <h1 class="docs-h1">单选 <span class="docs-en">Radio</span></h1>
        <p class="docs-lede">在互斥选项里选一项，例如会议提醒的提前时间。选项应全部可见；若列表很长，改用选择器。</p>

        <section class="docs-section">
          <h2 class="docs-h2">现场示例</h2>
          <div class="docs-stage docs-stack">
            <label class="aha-choice"><input type="radio" name="when" checked><span class="aha-radio-ui"></span>开始时</label>
            <label class="aha-choice"><input type="radio" name="when"><span class="aha-radio-ui"></span>提前 15 分钟</label>
            <label class="aha-choice"><input type="radio" name="when"><span class="aha-radio-ui"></span>提前一天</label>
          </div>
          <div class="docs-annote"><code class="docs-token" data-copy="--aha-color-primary" title="点击复制">--aha-color-primary</code><code class="docs-token" data-copy="--aha-radius-pill" title="点击复制">--aha-radius-pill</code></div>
        </section>
        <section class="docs-section">
          <h2 class="docs-h2">状态矩阵</h2>
          <table class="docs-matrix">
            <thead><tr><th></th><th>未选</th><th>已选</th><th>禁用</th><th>已选禁用</th></tr></thead>
            <tbody>
              <tr>
                <td class="docs-rowhead">单选</td>
                <td><label class="aha-choice"><input type="radio" name="m1"><span class="aha-radio-ui"></span>放置你的文本</label></td>
                <td><label class="aha-choice"><input type="radio" name="m2" checked><span class="aha-radio-ui"></span>放置你的文本</label></td>
                <td><label class="aha-choice"><input type="radio" name="m3" disabled><span class="aha-radio-ui"></span>放置你的文本</label></td>
                <td><label class="aha-choice"><input type="radio" name="m4" checked disabled><span class="aha-radio-ui"></span>放置你的文本</label></td>
              </tr>
            </tbody>
          </table>
        </section>

      </main>
    </div>
  </div>
  <div class="docs-backdrop" id="docs-backdrop"></div>
  <script src="../js/nav.js"></script>
  <script src="../js/docs.js"></script>
</body>
</html>
