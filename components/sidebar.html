<!DOCTYPE html>
<html lang="zh-CN" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>侧栏：AhaStation 设计系统</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body>
  <a class="aha-skip" href="#content">跳到正文</a>
  <div class="docs-shell">
    <aside class="docs-sidebar" id="docs-sidebar"></aside>
    <div class="docs-main-wrap">
      <header class="docs-topbar">
        <button type="button" class="docs-menu" aria-controls="docs-sidebar" aria-expanded="false" aria-label="打开导航"><span data-icon="menu"></span></button>
        <p class="docs-crumb">组合组件 / 侧栏</p>
      </header>
      <main id="content" class="docs-main docs-main--wide">
        <h1 class="docs-h1">侧栏 <span class="docs-en">Sidebar and nav rail</span></h1>
        <p class="docs-lede">窄轨负责在产品分区之间切换，宽侧栏列出当前分区里的项目室或文件夹。当前项用柔和的蓝浸，而不是粗重的色条。</p>

        <section class="docs-section">
          <div class="docs-stage docs-stage--canvas" style="padding:0; overflow:clip;">
            <div style="display:flex; min-height: 360px;">
              <nav class="aha-navrail" aria-label="产品分区">
                <button class="aha-navrail-btn is-active" type="button" aria-current="page" aria-label="项目室"><span data-icon="folder"></span></button>
                <button class="aha-navrail-btn" type="button" aria-label="会议"><span data-icon="calendar"></span></button>
                <button class="aha-navrail-btn" type="button" aria-label="看板"><span data-icon="kanban"></span></button>
                <button class="aha-navrail-btn" type="button" aria-label="消息"><span data-icon="message"></span></button>
                <span style="flex:1"></span>
                <button class="aha-navrail-btn" type="button" aria-label="设置"><span data-icon="settings"></span></button>
              </nav>
              <aside class="aha-appside" aria-label="项目室列表">
                <p class="docs-type-label" style="padding: 0 var(--aha-space-12);">项目室</p>
                <a class="aha-appside-item is-active" href="#"><span data-icon="folder"></span>视觉升级</a>
                <a class="aha-appside-item" href="#"><span data-icon="folder"></span>本周会议</a>
                <a class="aha-appside-item" href="#"><span data-icon="folder"></span>参考归档</a>
              </aside>
              <div class="aha-shell-main">
                <h3 class="aha-card-title">视觉升级</h3>
                <p class="aha-card-body">侧栏保持安静，主区再展开文件与卡片。</p>
              </div>
            </div>
          </div>
          <div class="docs-annote"><code class="docs-token" data-copy="--aha-color-primary-soft" title="点击复制">--aha-color-primary-soft</code><code class="docs-token" data-copy="--aha-line-soft" title="点击复制">--aha-line-soft</code></div>
        </section>

      </main>
    </div>
  </div>
  <div class="docs-backdrop" id="docs-backdrop"></div>
  <script src="../js/nav.js"></script>
  <script src="../js/docs.js"></script>
</body>
</html>
