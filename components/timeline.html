  <div class="docs-shell">

      <header class="docs-topbar">
        <button type="button" class="docs-menu" aria-controls="docs-sidebar" aria-expanded="false" aria-label="打开导航"><span data-icon="menu"></span></button>
        <p class="docs-crumb">组合组件 / 时间线</p>
      </header>
      <main id="content" class="docs-main">
        <h1 class="docs-h1">时间线 <span class="docs-en">Timeline</span></h1>
        <p class="docs-lede">按发生顺序呈现项目室里的事件。已完成项用蓝色勾选，未到或次要项保持更淡的语气。</p>

        <section class="docs-section">
          <div class="docs-stage" style="max-width: 28rem;">
            <ol class="aha-timeline">
              <li class="aha-timeline-item">
                <span class="aha-timeline-mark"><span data-icon="check"></span></span>
                <div>
                  <h3 class="aha-card-title">上传会议纪要</h3>

              </li>
              <li class="aha-timeline-item">
                <span class="aha-timeline-mark"><span data-icon="check"></span></span>

                  <h3 class="aha-card-title">确认字体方案</h3>
                  <p class="docs-type-caption">今天 18:00</p>
                </div>
              </li>
              <li class="aha-timeline-item is-muted">
                <span class="aha-timeline-mark"><span data-icon="clock"></span></span>
                <div>
                  <h3 class="aha-card-title">同步看板待办</h3>
                  <p class="docs-type-caption">明天</p>
                </div>
              </li>
            </ol>
          </div>
          <div class="docs-annote"><code class="docs-token" data-copy="--aha-color-primary-soft" title="点击复制">--aha-color-primary-soft</code><code class="docs-token" data-copy="--aha-line-soft" title="点击复制">--aha-line-soft</code></div>
